[project]
name = "benign-overfitting-icl"
version = "0.1.0"
description = "A traceable modernization of Garg et al. (2022) before benign overfitting extensions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15,<2.16",
    "transformers>=5.22.1,<5.23",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "xgboost>=3,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "tqdm>=4.67,<5",
    "wandb>=0.24,<1",
    "PyYAML>=6,<7",
    "munch>=4,<5",
    "funcy>=2,<3",
    "quinine==0.3.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' or sys_platform == 'win32'"]
# Quinine 0.3 pins PyYAML 5.4, which predates Python 3.12 wheels.
# Retain the upstream parser; validate inherited configs against PyYAML 6.
override-dependencies = [
    "PyYAML>=6,<7", "munch>=4,<5", "funcy>=2,<3",
    "cytoolz>=1,<2", "Cerberus>=1.3.7,<2",
    "gin-config>=0.5,<1", "toposort>=1.10,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["cuda: requires a real CUDA GPU"]
